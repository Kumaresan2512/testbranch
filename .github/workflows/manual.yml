name: Solana Devnet Airdrop

on:
  workflow_dispatch:
    inputs:
      solana_wallet_address:
        description: 'Your Solana Wallet Address (Devnet)'
        required: true
        type: string
      airdrop_amount:
        description: 'Amount of SOL to airdrop (Devnet)'
        required: true
        type: number
        default: 2

jobs:
  airdrop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana CLI for Devnet
        run: solana config set --url devnet

      - name: Request Airdrop
        run: solana airdrop 3 HBHaNYNc1zd63DpWkoQQeJDMRQL3mUHTVnSDtzFnFfap

      - name: Check Balance
        run: solana balance ${{ github.event.inputs.solana_wallet_address }}
